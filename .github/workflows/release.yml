name: release

# Runs when release-please publishes a GitHub release.
on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  binaries:
    name: binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built natively on each OS: OpenTUI ships one native library per platform.
          - { target: linux-x64, runner: ubuntu-latest }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-arm64, runner: macos-latest }
          - { target: darwin-x64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run compile bun-${{ matrix.target }}
      - name: Package
        run: |
          cd dist
          ./tuiaux-${{ matrix.target }} --version
          mv tuiaux-${{ matrix.target }} tuiaux
          tar -czf tuiaux-${{ matrix.target }}.tar.gz tuiaux
          shasum -a 256 tuiaux-${{ matrix.target }}.tar.gz > tuiaux-${{ matrix.target }}.tar.gz.sha256
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.tar.gz dist/*.sha256 --clobber

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
