name: release

# One workflow on purpose: a release created with GITHUB_TOKEN doesn't trigger
# other workflows, so the binaries are built here, gated on release-please's output.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  binaries:
    name: binary (${{ matrix.target }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built natively on each OS: OpenTUI ships one native library per platform.
          - { target: linux-x64, runner: ubuntu-latest }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-arm64, runner: macos-latest }
          - { target: darwin-x64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run compile bun-${{ matrix.target }}
      - name: Package
        run: |
          cd dist
          ./tuiaux-${{ matrix.target }} --version
          mv tuiaux-${{ matrix.target }} tuiaux
          tar -czf tuiaux-${{ matrix.target }}.tar.gz tuiaux
          shasum -a 256 tuiaux-${{ matrix.target }}.tar.gz > tuiaux-${{ matrix.target }}.tar.gz.sha256
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/*.tar.gz dist/*.sha256 --clobber
