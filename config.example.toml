# tuiaux configuration: ~/.config/tuiaux/config.toml ($XDG_CONFIG_HOME/tuiaux/config.toml).
# tuiaux creates the file empty on first run. Every key is optional; an invalid value falls back to
# its default and is listed in a dialog at startup.
#
# Repos aren't configured here: tuiaux remembers every repo that showed runs. Tokens aren't either:
# they come from `gh` and `glab`.

[theme]
# "terminal" (default) inherits your terminal's colors.
# Built-in: terminal, tuiaux-dark, tuiaux-light, tokyo-night, catppuccin-mocha, catppuccin-latte,
#           gruvbox-dark, nord, dracula, rose-pine, kanagawa
name = "terminal"

# Override any color: "#rrggbb", "default" (the terminal's own fg/bg) or "ansi:0".."ansi:15".
# Tokens: bg, surface, selection, line, text, muted, accent, success, running, failure, idle
[theme.colors]
# success = "#9ece6a"

[refresh]
active = 5   # seconds between polls of a hot repo while a run is in progress (2–300)
idle = 30    # seconds between polls of a hot repo when nothing runs (5–3600)

[notifications]
enabled = true
bell = true                     # ring the terminal bell
on = ["failure", "recovered"]   # also "success" (which includes "recovered")
